name: QA Xu Wen 230-231 browser paths
on:
  push:
    branches: [dev/m4-xu-wen-20261116]
    paths:
      - "scripts/qa_xu_service231.py"
      - ".github/workflows/m4-xu-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium for actual route test
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run targeted original-handler branch matrix at 390 / 1280 px
        run: python3 scripts/qa_xu_service231.py
