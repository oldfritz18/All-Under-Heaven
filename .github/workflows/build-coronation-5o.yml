name: Build and test preserved coronation editorial 5o
on:
  push:
    branches: [chatgpt/m4-coronation-5o]
    paths:
      - scripts/apply_coronation_5o.py
      - .github/workflows/build-coronation-5o.yml
jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact base and editorial additions
        run: python3 scripts/apply_coronation_5o.py --write
      - name: Static smoke test
        run: python3 scripts/smoke.py
      - name: Install browser runner for narrative regression
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run accession mandate, proclamation and decree regressions
        run: python3 scripts/qa_enthronement225.py --report /tmp/auh_qa_enthronement_5o.json
      - name: Run Han Sheng Dragon and frontline continuity regressions
        run: python3 scripts/qa_han_dragon229.py --report /tmp/auh_qa_han_dragon_5o.json
      - name: Publish QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auh-m4-5o-qa-reports
          path: /tmp/auh_qa_*_5o.json
          if-no-files-found: ignore
      - name: Commit generated HTML only if changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME/ACTIVE_BUILD.txt GAME/ALL_UNDER_HEAVEN_v0.4.99.5o_THE_OATH_THEY_HEARD.html
          if git diff --cached --quiet; then
            echo "Current 5o build is source-identical; nothing to commit"
          else
            git commit -m "Generate preserved 5o HTML after targeted QA [skip ci]"
            git push
          fi
