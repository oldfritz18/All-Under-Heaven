name: Build verified coronation editorial 5o
on:
  push:
    branches: [chatgpt/m4-coronation-5o]
    paths: ['scripts/apply_coronation_5o.py']
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-source editorial patch
        run: python3 scripts/apply_coronation_5o.py --write
      - name: Static smoke test
        run: python3 scripts/smoke.py
      - name: Commit generated playable HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME/ACTIVE_BUILD.txt GAME/ALL_UNDER_HEAVEN_v0.4.99.5o_THE_OATH_THEY_HEARD.html
          git commit -m "Generate preserved 5o build from verified 5n [skip ci]"
          git push
